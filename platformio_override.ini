; ***  PlatformIO Project Configuration Override File   ***
; ***  Changes done here override settings in platformio.ini    ***
;
; Place your personal settings like monitor_port and upload_port here
; instead of editing platformio.ini
; to avoid annoying merge conflicts when you pull updates into your
; personal clone of the repository
;
; Please visit documentation for the options and examples
; http://docs.platformio.org/en/stable/projectconf.html

[platformio]
default_envs = opendtu_c5

[env:opendtu_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_custom_16mb.csv
build_flags = ${env.build_flags}
    -DCMT_CLK=GPIO_NUM_6
    -DCMT_CS=GPIO_NUM_7
    -DCMT_FCS=GPIO_NUM_8
    -DCMT_SDIO=GPIO_NUM_9
    -DCMT_GPIO2=GPIO_NUM_10
    -DCMT_GPIO3=GPIO_NUM_11
upload_port = COM4
monitor_port = COM4
